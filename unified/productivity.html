<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Productivity · Mission Control</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}body{background:#101b2f;color:#eff5ff;margin:0;padding:25px;max-width:1000px}h1{font-size:26px}p{color:#aabbd5}form{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}input,select,button{font:inherit;border:1px solid #435777;border-radius:10px;padding:12px;background:#1c2b45;color:#fff}input{flex:1;min-width:190px}button{cursor:pointer}button:hover{background:#29446d}.item{display:flex;align-items:center;gap:12px;background:#192840;border:1px solid #324967;padding:12px;margin:9px 0;border-radius:12px}.item span{flex:1;overflow-wrap:anywhere}.done{text-decoration:line-through;opacity:.6}.actions{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#aabbd5;font-size:13px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.filters button[aria-pressed=true]{background:#335886}#status{min-height:20px}@media(max-width:600px){body{padding:14px}.item{flex-wrap:wrap}}</style></head><body><h1>Productivity OS</h1><p>Gestisci attività e priorità. I dati sono conservati soltanto in questo browser, non ancora sincronizzati con TickTick o Notion.</p><form id="add"><input id="task" maxlength="200" required placeholder="Nuova attività…" aria-label="Nuova attività"><select id="priority" aria-label="Priorità"><option value="normal">Normale</option><option value="high">Alta</option><option value="low">Bassa</option></select><button type="submit">Aggiungi</button></form><div class="filters"><button data-filter="all" aria-pressed="true">Tutte</button><button data-filter="open">Da fare</button><button data-filter="done">Completate</button></div><p id="status" role="status"></p><section id="list" aria-label="Elenco attività"></section><div class="actions"><button id="export">Esporta JSON</button><label for="import" style="display:inline-block;padding:12px;border:1px solid #435777;border-radius:10px;cursor:pointer">Importa JSON</label><input id="import" type="file" accept="application/json,.json" style="display:none"></div><p class="muted">L'importazione sostituisce l'elenco locale dopo conferma. Esporta una copia prima di cambiare browser o cancellare i dati.</p><script>
const KEY='mission-control-productivity-v1';let tasks=[];try{const stored=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(stored))tasks=stored.filter(valid)}catch{}let filter='all';const list=document.getElementById('list'),status=document.getElementById('status');function valid(t){return t&&typeof t.id==='string'&&typeof t.text==='string'&&t.text.length<=200&&typeof t.done==='boolean'&&['high','normal','low'].includes(t.priority)}function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks));status.textContent='Salvato in questo browser.'}catch{status.textContent='Impossibile salvare: esporta le attività.'}render()}function render(){list.replaceChildren();const visible=tasks.filter(t=>filter==='all'||(filter==='done'?t.done:!t.done));status.textContent=tasks.length+' attività, '+tasks.filter(t=>!t.done).length+' da fare.';if(!visible.length){const p=document.createElement('p');p.textContent='Nessuna attività in questa vista.';list.append(p)}for(const t of visible){const row=document.createElement('div');row.className='item';const check=document.createElement('input');check.type='checkbox';check.checked=t.done;check.setAttribute('aria-label','Completa '+t.text);check.onchange=()=>{t.done=check.checked;save()};const name=document.createElement('span');name.textContent=t.text+(t.priority==='high'?' · Priorità alta':t.priority==='low'?' · Priorità bassa':'');if(t.done)name.className='done';const del=document.createElement('button');del.textContent='Elimina';del.setAttribute('aria-label','Elimina '+t.text);del.onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);save()};row.append(check,name,del);list.append(row)}}document.getElementById('add').onsubmit=e=>{e.preventDefault();const input=document.getElementById('task'),text=input.value.trim();if(!text)return;tasks.unshift({id:crypto.randomUUID(),text,priority:document.getElementById('priority').value,done:false});input.value='';save()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mission-control-tasks.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>1000000)throw Error('File troppo grande');const data=JSON.parse(await file.text());if(!Array.isArray(data)||data.length>5000||!data.every(valid))throw Error('Formato non valido');if(confirm('Sostituire tutte le attività locali con '+data.length+' attività importate?')){tasks=data;save()}}catch(err){status.textContent='Importazione non riuscita: '+err.message}e.target.value=''};render();
</script></body></html>
