<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fitness OS</title><style>body{margin:0;background:#0c1425;color:#edf3ff;font:16px system-ui;padding:28px}main{max-width:900px;margin:auto}h1{font-size:30px}section{background:#17243a;border:1px solid #34435b;border-radius:16px;padding:20px;margin:16px 0}label{display:block;margin:12px 0}input,textarea,button{font:inherit;border-radius:8px;padding:10px}input,textarea{background:#0e192c;color:white;border:1px solid #66758c;max-width:100%}button{background:#8bc8ff;border:0;cursor:pointer}small{color:#bdc9d9}li{padding:6px}</style></head><body><main><h1>♥ Fitness OS</h1><p>Diario locale di allenamento e progressi. I dati restano in questo browser; Apple Health e altri servizi non sono ancora collegati.</p><section><h2>Registra allenamento</h2><form id="f"><label>Data <input name="date" type="date" required></label><label>Attività <input name="activity" placeholder="Es. Pesi — petto" required maxlength="120"></label><label>Durata (minuti) <input name="minutes" type="number" min="1" max="1440" required></label><button>Salva allenamento</button></form></section><section><h2>Diario</h2><ul id="items"></ul><button id="export" type="button">Esporta JSON</button><p><small>Non usare questo diario per dati che non vuoi conservare nel browser.</small></p></section></main><script>const key='mission-control-fitness-v1';const f=document.getElementById('f'),items=document.getElementById('items');f.elements.date.value=new Date().toLocaleDateString('en-CA');let rows=[];try{rows=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(rows))rows=[]}catch{}function render(){items.replaceChildren();for(const [i,r] of rows.entries()){const li=document.createElement('li');li.textContent=r.date+' · '+r.activity+' · '+r.minutes+' min ';const b=document.createElement('button');b.textContent='Elimina';b.onclick=()=>{rows.splice(i,1);save()};li.append(b);items.append(li)}if(!rows.length){const li=document.createElement('li');li.textContent='Nessun allenamento registrato';items.append(li)}}function save(){localStorage.setItem(key,JSON.stringify(rows));render()}f.onsubmit=e=>{e.preventDefault();const v=new FormData(f);rows.unshift({date:String(v.get('date')),activity:String(v.get('activity')).slice(0,120),minutes:Number(v.get('minutes'))});save();f.reset();f.elements.date.value=new Date().toLocaleDateString('en-CA')};document.getElementById('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(rows,null,2)],{type:'application/json'}));a.download='fitness-os.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();</script></body></html>
