<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission Control</title><style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#080e1c;color:#eaf1ff}.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}aside{background:#0d1629;border-right:1px solid #27354e;padding:24px 14px}h1{font-size:20px;margin:0 8px 6px}.sub{color:#8fa3c4;font-size:12px;margin:0 8px 24px}nav{display:grid;gap:7px}button{font:inherit;cursor:pointer;border:1px solid transparent;background:transparent;color:#b7c7e2;text-align:left;padding:12px 14px;border-radius:12px}button:hover,button[aria-selected=true]{background:#1c3153;color:white;border-color:#37557f}main{padding:24px;min-width:0}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}h2{margin:0;font-size:24px}.hint{font-size:13px;color:#a5b6d2}.panel{border:1px solid #293b57;border-radius:18px;background:#111e33;overflow:hidden}.frame{display:block;border:0;width:100%;height:calc(100vh - 130px);min-height:600px;background:white}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;padding:20px}.card{border:1px solid #344663;background:#152641;padding:20px;border-radius:14px}.card h3{margin:0 0 10px}.card p{color:#b4c4df;font-size:14px;line-height:1.5}.card button{background:#243d62;border:1px solid #47658e;width:100%}.empty{padding:28px;color:#b4c4df;line-height:1.6}a{color:#9bc7ff}@media(max-width:700px){.shell{grid-template-columns:1fr}aside{padding:12px;border-right:0;border-bottom:1px solid #27354e}nav{display:flex;overflow-x:auto}nav button{white-space:nowrap}main{padding:14px}.frame{height:70vh;min-height:500px}}
</style></head><body><div class="shell"><aside><h1>Mission Control</h1><p class="sub">Workspace personale</p><nav aria-label="Sezioni" id="nav"></nav></aside><main><header><div><h2 id="heading">Panoramica</h2><div class="hint" id="description">Tutti i tuoi strumenti in un unico posto</div></div><button id="reload" hidden>↻ Ricarica sezione</button></header><section id="content" class="panel" aria-live="polite"></section></main></div><script>
const career='https://missioncontrolcareeros2026-11-12.vercel.app/';
const fitness='https://mission-control-unified-preview.vercel.app/fitness-os.html';
const tabs=[['home','⌂ Panoramica','Riepilogo delle aree disponibili'],['career','▣ Career OS','Opportunità e candidature'],['fitness','♥ Fitness OS','Allenamenti, attività, nutrizione, composizione, recupero e cuore'],['productivity','✓ Productivity','Area di integrazione delle attività'],['mail','✉ Mail Center','Area di integrazione della posta'],['ai','✧ AI Hub','Area di integrazione degli assistenti'],['mac','⌘ Mac Control','Area di integrazione del Mac']];
const nav=document.getElementById('nav'),content=document.getElementById('content'),reload=document.getElementById('reload');
tabs.forEach(([id,label])=>{const b=document.createElement('button');b.textContent=label;b.dataset.tab=id;b.onclick=()=>show(id);nav.appendChild(b)});
function show(id){if(!tabs.some(t=>t[0]===id))id='home';location.hash=id;const item=tabs.find(t=>t[0]===id);document.getElementById('heading').textContent=item[1].replace(/^[^ ]+ /,'');document.getElementById('description').textContent=item[2];nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===id)));content.replaceChildren();reload.hidden=!['career','fitness','productivity','mail','ai','mac'].includes(id);
if(id==='career'||id==='fitness'||id==='productivity'||id==='mail'||id==='ai'||id==='mac'){const url=id==='career'?career:id==='fitness'?fitness:id==='productivity'?'./productivity.html':id==='mail'?'./mail-center.html':id==='ai'?'./ai-hub.html':'./mac-control.html';const frame=document.createElement('iframe');frame.className='frame';frame.title=item[1];frame.src=url;frame.referrerPolicy='strict-origin-when-cross-origin';content.appendChild(frame);const p=document.createElement('p');p.style.padding='0 20px';const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Apri '+item[1]+' in una nuova scheda';p.appendChild(a);content.appendChild(p);reload.onclick=()=>{frame.src=url};return}
if(id==='home'){const cards=document.createElement('div');cards.className='cards';for(const key of ['career','fitness','productivity','mail','ai','mac']){const t=tabs.find(t=>t[0]===key),c=document.createElement('div');c.className='card';const h=document.createElement('h3');h.textContent=t[1];const p=document.createElement('p');p.textContent=t[2];const b=document.createElement('button');b.textContent='Apri sezione';b.onclick=()=>show(key);c.append(h,p,b);cards.appendChild(c)}content.appendChild(cards);return}
const p=document.createElement('p');p.className='empty';p.textContent='Sezione predisposta. Le connessioni ai servizi esterni saranno aggiunte dopo aver verificato le autorizzazioni e le API disponibili.';content.appendChild(p)}
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));show(location.hash.slice(1)||'home');
</script></body></html>
